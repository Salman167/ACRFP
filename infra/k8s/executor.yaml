apiVersion: apps/v1
kind: Deployment
metadata:
  name: acrfp-executor
  labels:
    app: acrfp-executor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: acrfp-executor
  template:
    metadata:
      labels:
        app: acrfp-executor
    spec:
      serviceAccountName: acrfp-executor
      containers:
        - name: executor
          image: acrfp/api:dev
          command: ["python3", "-m", "uvicorn", "executor.app:app", "--host", "0.0.0.0", "--port", "8002"]
          ports:
            - containerPort: 8002
          env:
            - name: PYTHONPATH
              value: /usr/local/lib/python3.11/site-packages:/app/src
            - name: ACRFP_MODE
              value: azure
---
apiVersion: v1
kind: Service
metadata:
  name: acrfp-executor
spec:
  selector:
    app: acrfp-executor
  ports:
    - port: 8002
      targetPort: 8002
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: acrfp-executor
