apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: acrfp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/your-repo.git
    targetRevision: HEAD
    path: infra/helm/acrfp
    helm:
      valueFiles:
        - values.yaml
        - values-ingress.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
